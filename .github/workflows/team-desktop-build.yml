name: Team Desktop Build

# Build a reviewed commit by explicitly pushing a NEW team tag.
# No default-branch change or upstream release tags. Nothing is signed or
# published until a reviewer approves the `team-desktop-release` environment:
#   build (no secrets) -> gate -> sign (approval, private key) -> publish.
on:
  push:
    tags:
      - 'team-desktop-v*'

permissions:
  contents: read

concurrency:
  group: team-desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'TeacherChae/buzz-teacherchae'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      VITE_BUZZ_BESTIE: '0'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require source from the team branch
        run: git merge-base --is-ancestor HEAD origin/team/custom-desktop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Test team packaging contract
        run: pnpm --dir desktop exec node --test scripts/prepare-team-release.test.mjs

      - name: Prepare team version and updater configuration
        id: version
        working-directory: desktop
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-team-release.mjs "$GITHUB_REF_NAME"

      - name: Set up the pinned Rust toolchain and lockfile
        run: |
          rustup target add "$TARGET"
          cargo update --workspace --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build functional sidecars
        run: |
          packages=(-p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli)
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            packages+=(-p buzz-backend-kubernetes)
          fi
          cargo build --release --locked --target "$TARGET" "${packages[@]}"
          ./scripts/bundle-sidecars.sh "$TARGET"

      # Keep the upstream macOS MeshLLM feature instead of silently dropping it.
      - name: Prepare macOS Metal libraries
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          SHORT="${REV:0:7}"
          cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          [[ -n "$MESH_ROOT" ]] || { echo 'MeshLLM checkout missing' >&2; exit 1; }
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      # No private updater signing secrets are exposed anywhere in this job.
      # Use the repo's pnpm tauri wrapper (not pnpm exec tauri) for packaging.
      - name: Build Windows test installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: |
          pnpm tauri build --target "$TARGET" --bundles nsis \
            --config src-tauri/tauri.release.conf.json -- --locked

      - name: Build ad-hoc macOS test app
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: '0'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          pnpm tauri build --target "$TARGET" --bundles app dmg --features mesh-llm \
            --config src-tauri/tauri.release.conf.json -- --locked

      - name: Verify macOS signature integrity and entitlements
        if: runner.os == 'macOS'
        run: |
          APP="desktop/src-tauri/target/$TARGET/release/bundle/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          desktop/scripts/verify-macos-entitlements.sh "$APP"

      - name: Stage only installers and update artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="desktop/src-tauri/target/$TARGET/release/bundle"
          mkdir -p team-artifacts
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            INSTALLERS=("$BUNDLE"/nsis/*.exe)
            [[ ${#INSTALLERS[@]} -eq 1 ]] || { echo 'Expected one NSIS installer' >&2; exit 1; }
            cp "${INSTALLERS[0]}" team-artifacts/
          else
            INSTALLERS=("$BUNDLE"/dmg/*.dmg)
            [[ ${#INSTALLERS[@]} -eq 1 ]] || { echo 'Expected one DMG' >&2; exit 1; }
            test -d "$BUNDLE/macos/Buzz.app"
            cp "${INSTALLERS[0]}" team-artifacts/
            # Retain the exact ad-hoc signed app for later, gated updater signing.
            tar -czf team-artifacts/Buzz.app.tar.gz -C "$BUNDLE/macos" Buzz.app
          fi
          printf 'version=%s\nsource=%s\ntarget=%s\n' "$VERSION" "$(git rev-parse HEAD)" "$TARGET" > team-artifacts/build-info.txt

      - name: Upload test installers (not a release or updater promotion)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-team-${{ github.ref_name }}-${{ matrix.target }}-${{ github.run_attempt }}
          path: team-artifacts/
          if-no-files-found: error
          retention-days: 7

  # A job that names a missing environment makes GitHub create it with no
  # protection, which would sign without approval. Refuse unless a human
  # reviewer is required. This job must not reference the environment itself.
  gate:
    if: github.repository == 'TeacherChae/buzz-teacherchae'
    name: Require an approval-protected signing environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check required reviewers on team-desktop-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/team-desktop-release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          [[ "$reviewers" -ge 1 ]] || {
            echo 'team-desktop-release has no required reviewers; not signing' >&2
            exit 1
          }

  # The only job that sees the private updater key. It runs after approval,
  # installs dependencies without lifecycle scripts, and builds nothing.
  sign:
    name: Sign updater payloads (approval required)
    needs: [build, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: team-desktop-release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install the pinned Tauri CLI without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-team-${{ github.ref_name }}-*
          path: built

      - name: Stage the reviewed installers from this run
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${TAG#team-desktop-v}"
          SOURCE=$(git rev-parse HEAD)
          newest() {
            local dirs=(built/"buzz-team-$TAG-$1"-*)
            [[ ${#dirs[@]} -ge 1 ]] || { echo "No build artifact for $1" >&2; return 1; }
            printf '%s\n' "${dirs[@]}" | sort -V | tail -n 1
          }
          WIN=$(newest x86_64-pc-windows-msvc)
          MAC=$(newest aarch64-apple-darwin)
          for dir in "$WIN" "$MAC"; do
            grep -qxF "version=$VERSION" "$dir/build-info.txt"
            grep -qxF "source=$SOURCE" "$dir/build-info.txt"
          done
          EXES=("$WIN"/*.exe)
          DMGS=("$MAC"/*.dmg)
          [[ ${#EXES[@]} -eq 1 && ${#DMGS[@]} -eq 1 && -f "$MAC/Buzz.app.tar.gz" ]] || {
            echo 'Expected one NSIS installer, one DMG and Buzz.app.tar.gz' >&2
            exit 1
          }
          mkdir signed
          cp "${EXES[0]}" "${DMGS[0]}" signed/
          cp "$MAC/Buzz.app.tar.gz" "signed/Buzz_${VERSION}_aarch64.app.tar.gz"

      - name: Sign the updater payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || {
            echo 'TAURI_SIGNING_PRIVATE_KEY is not set on team-desktop-release' >&2
            exit 1
          }
          for file in signed/*.exe signed/*.app.tar.gz; do
            pnpm --dir desktop exec tauri signer sign "$GITHUB_WORKSPACE/$file"
            test -s "$file.sig"
          done

      # Installed apps reject a payload signed by any other key, so prove the
      # signatures match the public key that the builds embed before publishing.
      - name: Verify signatures against the shipped public key
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          printf '%s' "$BUZZ_UPDATER_PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/updater.pub"
          for file in signed/*.exe signed/*.app.tar.gz; do
            base64 -d "$file.sig" > "$RUNNER_TEMP/payload.minisig"
            minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$file" -x "$RUNNER_TEMP/payload.minisig"
          done

      - name: Hand signed files to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-team-signed-${{ github.ref_name }}-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It holds no signing secrets.
  publish:
    name: Publish the release and move the update channel
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: team-desktop-update-channel
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-team-signed-${{ github.ref_name }}-*
          path: handoff

      - name: Build and validate the update manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${TAG#team-desktop-v}"
          # A single matching artifact is unpacked straight into handoff/;
          # several (one per sign attempt) each get their own directory.
          DIRS=(handoff/"buzz-team-signed-$TAG"-*/)
          if [[ ${#DIRS[@]} -ge 1 ]]; then
            cp -R "$(printf '%s\n' "${DIRS[@]}" | sort -V | tail -n 1)" signed
          else
            cp -R handoff signed
          fi
          EXES=(signed/*.exe)
          TARBALLS=(signed/*.app.tar.gz)
          [[ ${#EXES[@]} -eq 1 && ${#TARBALLS[@]} -eq 1 ]] || {
            echo 'Expected one signed installer and one signed app archive' >&2
            exit 1
          }
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "darwin-aarch64:${TARBALLS[0]}.sig:$BASE/$(basename "${TARBALLS[0]}")" \
            "windows-x86_64:${EXES[0]}.sig:$BASE/$(basename "${EXES[0]}")" > latest.json
          CURRENT=()
          if gh release view team-desktop-latest --json assets --jq '.assets[].name' > channel-assets.txt; then
            if grep -qxF latest.json channel-assets.txt; then
              gh release download team-desktop-latest --pattern latest.json --dir current
              CURRENT=(current/latest.json)
            fi
          fi
          node desktop/scripts/team-update-manifest.mjs "$TAG" latest.json "${CURRENT[@]}"

      - name: Publish the versioned release
        run: |
          set -euo pipefail
          VERSION="${TAG#team-desktop-v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" signed/* --clobber
          else
            gh release create "$TAG" signed/* --verify-tag --prerelease \
              --title "Buzz team build $VERSION" --notes "Source commit: $GITHUB_SHA"
          fi
          for url in $(jq -r '.platforms[].url' latest.json); do
            curl --fail --silent --show-error --location --head --retry 5 --retry-delay 5 "$url" > /dev/null
          done

      # Last step on purpose: installed apps only see a version after both of
      # its payloads are downloadable.
      - name: Move the update channel
        run: |
          set -euo pipefail
          if ! gh release view team-desktop-latest > /dev/null 2>&1; then
            gh release create team-desktop-latest --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Buzz team update channel' \
              --notes 'Rolling pointer read by installed team builds. Do not delete.'
          fi
          gh release upload team-desktop-latest latest.json --clobber
